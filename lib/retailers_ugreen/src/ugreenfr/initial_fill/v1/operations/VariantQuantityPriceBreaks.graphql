query VariantQuantityPriceBreaks($pageSize5: Int!, $country: CountryCode!, $language: LanguageCode!, $id: ID!, $after: String) @inContext(country: $country, language: $language) { node(id: $id) { __typename ... on ProductVariant { id quantityPriceBreaks(first: $pageSize5, after: $after) {
            pageInfo {
              hasNextPage
              endCursor
            }
            edges {
              cursor
              node {
                __typename
                minimumQuantity
                price {
                  __typename
                  amount
                  currencyCode
                }
              }
            }
          } } } }
