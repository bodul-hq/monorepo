query VariantComponents($pageSize5: Int!, $country: CountryCode!, $language: LanguageCode!, $id: ID!, $after: String) @inContext(country: $country, language: $language) { node(id: $id) { __typename ... on ProductVariant { id components(first: $pageSize5, after: $after) {
            pageInfo {
              hasNextPage
              endCursor
            }
            edges {
              cursor
              node {
                __typename
                productVariant {
                  __typename
                  id
                  title
                }
                quantity
              }
            }
          } } } }
