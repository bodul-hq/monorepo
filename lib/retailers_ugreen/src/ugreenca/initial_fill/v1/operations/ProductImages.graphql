query ProductImages($pageSize25: Int!, $country: CountryCode!, $language: LanguageCode!, $id: ID!, $after: String) @inContext(country: $country, language: $language) { product(id: $id) { id images(first: $pageSize25, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          __typename
          altText
          height
          id
          thumbhash
          url
          width
        }
      }
    } } }
