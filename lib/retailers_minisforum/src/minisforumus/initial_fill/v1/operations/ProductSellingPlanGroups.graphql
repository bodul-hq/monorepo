query ProductSellingPlanGroups($pageSize5: Int!, $pageSize20: Int!, $country: CountryCode!, $language: LanguageCode!, $id: ID!, $after: String) @inContext(country: $country, language: $language) { product(id: $id) { id sellingPlanGroups(first: $pageSize20, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          __typename
          appName
          name
          options {
            __typename
            name
            values
          }
          sellingPlans(first: $pageSize5) {
            pageInfo {
              hasNextPage
              endCursor
            }
            edges {
              cursor
              node {
                __typename
                billingPolicy {
                  __typename
                  ... on SellingPlanRecurringBillingPolicy {
                    interval
                    intervalCount
                  }
                }
                checkoutCharge {
                  __typename
                  type
                  value {
                    __typename
                    ... on MoneyV2 {
                      amount
                      currencyCode
                    }
                    ... on SellingPlanCheckoutChargePercentageValue {
                      percentage
                    }
                  }
                }
                deliveryPolicy {
                  __typename
                  ... on SellingPlanRecurringDeliveryPolicy {
                    interval
                    intervalCount
                  }
                }
                description
                id
                name
                options {
                  __typename
                  name
                  value
                }
                priceAdjustments {
                  __typename
                  adjustmentValue {
                    __typename
                    ... on SellingPlanFixedAmountPriceAdjustment {
                      adjustmentAmount {
                        __typename
                        amount
                        currencyCode
                      }
                    }
                    ... on SellingPlanFixedPriceAdjustment {
                      price {
                        __typename
                        amount
                        currencyCode
                      }
                    }
                    ... on SellingPlanPercentagePriceAdjustment {
                      adjustmentPercentage
                    }
                  }
                  orderCount
                }
                recurringDeliveries
              }
            }
          }
        }
      }
    } } }
