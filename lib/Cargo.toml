[workspace]
resolver = "2"
members = [
    "shared",
    "money",
    "retailer_sauce",
    "retailer_data_extractor",
    "retailers_anker",
    "retailers_mi",
    "retailers_minisforum",
    "retailers_ugreen",
    "retailers_wip",
    "sitemap",
    "object_storage_client",
    "testimony",
    "testimony_infra",
    "everyday",
    "everyday_infra",
    "inbox_client",
]

[workspace.dependencies]
graphql_client = "0.16.0"
scraper = { version = "0.27.0", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
everyday = { path = "everyday" }
html-extractor = { version = "0.3.3-dev.2", registry = "null-labs-hq" }
money = { path = "money" }
retailer_sauce = { path = "retailer_sauce" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
shared = { path = "shared" }
thiserror = "2.0.20"
url = "2.5.8"
