[workspace]
resolver = "2"
members = [
    "shared",
    "money",
    "retailer_sauce",
    "retailer_data_extractor",
    "retailers_anker",
    "retailers_mi",
    "retailers_minisforum",
    "retailers_ugreen",
    "retailers_wip",
    "sitemap",
    "object_storage_client",
    "testimony",
    "testimony_infra",
    "everyday",
    "everyday_infra",
    "inbox_client",
]

[workspace.dependencies]
bodul_shared = { version = "0.1.1", registry = "null-labs-hq" }
chrono = { version = "0.4.45", default-features = false, features = ["std", "serde"] }
everyday = { path = "everyday" }
html-extractor = { version = "0.3.3-dev.2", registry = "null-labs-hq" }
money = { path = "money" }
retailer_sauce = { path = "retailer_sauce" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.20"
