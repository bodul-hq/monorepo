[package]
name = "retailer_data_extractor"
version = "0.1.0"
edition = "2024"
publish = ["null-labs-hq"]

[dependencies]
html-extractor.workspace = true
retailer_sauce.workspace = true
retailers_anker = { version = "0.2.0", registry = "bodul" }
retailers_minisforum = { version = "0.2.0", registry = "bodul" }
retailers_ugreen = { version = "0.2.0", registry = "bodul" }
scraper.workspace = true
serde.workspace = true
serde_json.workspace = true
shared.workspace = true

[dev-dependencies]
# Match the JSON feature enabled by object-storage clients in apps and services.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
