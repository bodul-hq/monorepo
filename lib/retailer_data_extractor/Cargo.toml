[package]
name = "retailer_data_extractor"
version = "0.1.0"
edition = "2024"
publish = ["null-labs-hq"]

[dependencies]
bodul_shared.workspace = true
html-extractor.workspace = true
retailer_sauce.workspace = true
retailers_anker = { path = "../retailers_anker" }
retailers_mi = { path = "../retailers_mi" }
retailers_minisforum = { path = "../retailers_minisforum" }
retailers_ugreen = { path = "../retailers_ugreen" }
retailers_wip = { path = "../retailers_wip" }

scraper = { version = "0.27.0", default-features = false }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Match the JSON feature enabled by object-storage clients in apps and services.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
