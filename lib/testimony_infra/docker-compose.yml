services:

  testimony_postgres_dev:
    image: "postgres:17-alpine"
    container_name: testimony_postgres_dev
    environment:
      POSTGRES_DB: testimony
      POSTGRES_PASSWORD: n0p455
      POSTGRES_USER: root
    shm_size: '1gb'
    volumes:
      - /var/testimony_postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      testimony_network:
        ipv4_address: 172.28.34.102
    restart: unless-stopped
  testimony_postgres_test:
    image: "postgres:17-alpine"
    container_name: testimony_postgres_test
    environment:
      POSTGRES_DB: testimony
      POSTGRES_PASSWORD: n0p455
      POSTGRES_USER: root
    shm_size: '1gb'
    volumes:
      - /var/testimony_postgres_data_test:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      testimony_network:
        ipv4_address: 172.28.34.201
    restart: unless-stopped

networks:
  testimony_network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.34.0/24
          # gateway: 172.28.7.1
