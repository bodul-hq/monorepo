query VariantStoreAvailability($pageSize5: Int!, $country: CountryCode!, $language: LanguageCode!, $id: ID!, $after: String) @inContext(country: $country, language: $language) { node(id: $id) { __typename ... on ProductVariant { id storeAvailability(first: $pageSize5, after: $after) {
            pageInfo {
              hasNextPage
              endCursor
            }
            edges {
              cursor
              node {
                __typename
                available
                location {
                  __typename
                  address {
                    __typename
                    address1
                    address2
                    city
                    country
                    countryCode
                    formatted
                    latitude
                    longitude
                    phone
                    province
                    provinceCode
                    zip
                  }
                  id
                  name
                }
                pickUpTime
                quantityAvailable
              }
            }
          } } } }
