query ProductMedia($pageSize25: Int!, $country: CountryCode!, $language: LanguageCode!, $id: ID!, $after: String) @inContext(country: $country, language: $language) { product(id: $id) { id media(first: $pageSize25, after: $after) {
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          __typename
          ... on ExternalVideo {
            alt
            embedUrl
            host
            mediaContentType
            originUrl
            presentation {
              __typename
              id
            }
            previewImage {
              __typename
              altText
              height
              id
              thumbhash
              url
              width
            }
          }
          ... on MediaImage {
            alt
            id
            image {
              __typename
              altText
              height
              id
              thumbhash
              url
              width
            }
            mediaContentType
            presentation {
              __typename
              id
            }
            previewImage {
              __typename
              altText
              height
              id
              thumbhash
              url
              width
            }
          }
          ... on Model3d {
            alt
            mediaContentType
            presentation {
              __typename
              id
            }
            previewImage {
              __typename
              altText
              height
              id
              thumbhash
              url
              width
            }
            sources {
              __typename
              filesize
              format
              mimeType
              url
            }
          }
          ... on Video {
            alt
            mediaContentType
            presentation {
              __typename
              id
            }
            previewImage {
              __typename
              altText
              height
              id
              thumbhash
              url
              width
            }
            sources {
              __typename
              format
              height
              mimeType
              url
              width
            }
          }
        }
      }
    } } }
