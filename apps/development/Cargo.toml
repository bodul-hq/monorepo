[package]
name = "development"
version = "0.1.0"
edition = "2024"
default-run = "development"

[dependencies]
bodul_shared = { version = "0.1.1", registry = "null-labs-hq" }
percent-encoding = "2.3.2"
poem.workspace = true
reqwest = { version = "0.13.5", features = ["blocking", "json"] }
retailer_data_extractor = { path = "../../lib/retailer_data_extractor" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sitemap = { path = "../../lib/sitemap" }
tokio.workspace = true

[dev-dependencies]
poem = { workspace = true, features = ["test"] }
