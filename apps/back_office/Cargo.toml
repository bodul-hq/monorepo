[package]
name = "back_office"
version = "0.1.0"
edition = "2024"

[dependencies]
diesel = { version = "2", features = ["postgres", "r2d2", "serde_json"] }
diesel_migrations = "2"
poem = { workspace = true, features = ["session"] }
rand = "0.10"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
poem = { workspace = true, features = ["test"] }
