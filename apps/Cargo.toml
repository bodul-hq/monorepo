[workspace]
resolver = "2"
members = [
    "customers",
    "development",
]

[workspace.dependencies]
poem = "3.1.12"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../lib/shared" }
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
