[workspace]
resolver = "2"
members = [
    "retailer_sourcing",
    "offers",
    "customer_facing",
    "object_storage",
]

[workspace.dependencies]
async-graphql = "7.2.1"
async-graphql-poem = "7.2.1"
axum = "0.8.9"
bodul_shared = { version = "0.1.1", registry = "null-labs-hq" }
chrono = { version = "0.4", features = ["serde"] }
commanding_api = { path = "../../mulac/libs/commanding_api" }
diesel = { version = "2", features = ["chrono", "postgres", "r2d2", "serde_json", "uuid"] }
diesel_migrations = "2"
eventing_api = { path = "../../mulac/libs/eventing_api" }
http-body-util = "0.1.5"
inbox_api = { path = "../../mulac/libs/inbox_api" }
kernel = { path = "../../mulac/kernel", package = "mulac-kernel" }
money = { path = "../lib/money" }
mulac_poem = { path = "../../mulac/libs/mulac_poem", features = ["commanding", "eventing", "outbox"] }
outbox_api = { path = "../../mulac/libs/outbox_api" }
poem = "3.1.12"
poem-openapi = { version = "5.1.16", features = ["swagger-ui"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared = { path = "../lib/shared" }
thiserror = "2"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["trace"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = "2"
utoipa-swagger-ui = { version = "10.0.1", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["serde", "v4", "v7"] }
