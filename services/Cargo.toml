[workspace]
resolver = "2"
members = [
    "retailer_sourcing",
    "offers",
    "customer_facing",
]

[workspace.dependencies]
diesel = { version = "2", features = ["chrono", "postgres", "r2d2", "serde_json", "uuid"] }
diesel_migrations = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4", "v7"] }
