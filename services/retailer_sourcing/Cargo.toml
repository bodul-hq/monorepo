[package]
name = "retailer_sourcing"
version = "0.1.0"
edition = "2024"
default-run = "retailer_sourcing"

[dependencies]
async-graphql.workspace = true
async-graphql-axum = "7.2.1"
axum.workspace = true
bodul_shared = { version = "0.1.1", registry = "null-labs-hq" }
chrono.workspace = true
diesel.workspace = true
diesel_migrations.workspace = true
flate2 = "1"
kernel = { git = "https://github.com/nulllabsdev/mulac", package = "mulac-kernel", tag = "0.3.0" }
object_storage_client = { path = "../../lib/object_storage_client" }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["blocking"] }
retailer_data_extractor = { path = "../../lib/retailer_data_extractor" }
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
sitemap = { path = "../../lib/sitemap" }
strum = { version = "0.27", features = ["derive"] }
thiserror = "2"
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui.workspace = true
uuid.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true
