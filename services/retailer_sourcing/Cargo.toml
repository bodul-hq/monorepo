[package]
name = "retailer_sourcing"
version = "0.1.0"
edition = "2024"
default-run = "retailer_sourcing"

[dependencies]
async-graphql.workspace = true
async-graphql-axum = "7.2.1"
axum.workspace = true
chrono.workspace = true
commanding = { workspace = true, features = ["axum-openapi"] }
diesel.workspace = true
diesel_migrations.workspace = true
eventing = { workspace = true, features = ["axum-openapi"] }
fastrand = "2.5"
flate2 = "1"
inbox = { workspace = true, features = ["axum-openapi"] }
inbox_client.workspace = true
kernel.workspace = true
money.workspace = true
object_storage_client = { path = "../../lib/object_storage_client" }
outbox = { workspace = true, features = ["axum-openapi"] }
percent-encoding = "2.3.2"
reqwest = { version = "0.13.4", features = ["blocking"] }
retailer_data_extractor = { path = "../../lib/retailer_data_extractor" }
retailer_sauce.workspace = true
serde.workspace = true
serde_json.workspace = true
shared.workspace = true
sitemap = { path = "../../lib/sitemap" }
strum = { version = "0.27", features = ["derive"] }
thiserror.workspace = true
tokio.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
utoipa = "6.0.0"
utoipa-axum = "0.3.0"
utoipa-swagger-ui.workspace = true
uuid.workspace = true

[dev-dependencies]
commanding = { workspace = true, features = ["api-testing"] }
eventing = { workspace = true, features = ["api-testing"] }
http-body-util.workspace = true
inbox = { workspace = true, features = ["api-testing"] }
outbox = { workspace = true, features = ["api-testing"] }
tower.workspace = true
